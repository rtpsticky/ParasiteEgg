<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parasite egg detector (ONNX Runtime Web)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; }
  canvas { max-width: 100%; border: 1px solid #ccc; }
  #status { margin: .5rem 0; color: #555; }
</style>
</head>
<body>
<h1>ตรวจไข่พยาธิ</h1>
<input type="file" id="file" accept="image/*" capture="environment">
<div id="status">กำลังโหลดโมเดล…</div>
<canvas id="canvas"></canvas>
<ul id="list"></ul>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.all.min.js"></script>
<script>
const SIZE = 640, CONF = 0.25, IOU = 0.45;
let session, classes;

async function init() {
  classes = await (await fetch('model/classes.json')).json();
  const providers = navigator.gpu ? ['webgpu', 'wasm'] : ['wasm'];
  session = await ort.InferenceSession.create('model/parasite.onnx', { executionProviders: providers });
  status(`พร้อมใช้งาน (${providers[0]})`);
}
const status = t => document.getElementById('status').textContent = t;

// Letterbox to SIZE x SIZE, gray padding, RGB float [0,1], CHW.
function preprocess(img) {
  const r = Math.min(SIZE / img.width, SIZE / img.height);
  const w = Math.round(img.width * r), h = Math.round(img.height * r);
  const px = (SIZE - w) / 2, py = (SIZE - h) / 2;
  const c = new OffscreenCanvas(SIZE, SIZE), g = c.getContext('2d');
  g.fillStyle = 'rgb(114,114,114)'; g.fillRect(0, 0, SIZE, SIZE);
  g.drawImage(img, px, py, w, h);
  const d = g.getImageData(0, 0, SIZE, SIZE).data, n = SIZE * SIZE;
  const f = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    f[i] = d[i * 4] / 255; f[n + i] = d[i * 4 + 1] / 255; f[2 * n + i] = d[i * 4 + 2] / 255;
  }
  return { tensor: new ort.Tensor('float32', f, [1, 3, SIZE, SIZE]), r, px, py };
}

function iou(a, b) {
  const x1 = Math.max(a.x1, b.x1), y1 = Math.max(a.y1, b.y1);
  const x2 = Math.min(a.x2, b.x2), y2 = Math.min(a.y2, b.y2);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / ((a.x2 - a.x1) * (a.y2 - a.y1) + (b.x2 - b.x1) * (b.y2 - b.y1) - inter);
}

// Output: [1, 4 + C, N] -> boxes in original image coords, class-wise NMS.
function postprocess(out, { r, px, py }) {
  const [, ch, n] = out.dims, data = out.data, C = ch - 4, boxes = [];
  for (let i = 0; i < n; i++) {
    let best = 0, cls = -1;
    for (let c = 0; c < C; c++) { const s = data[(4 + c) * n + i]; if (s > best) { best = s; cls = c; } }
    if (best < CONF) continue;
    const cx = data[i], cy = data[n + i], w = data[2 * n + i], h = data[3 * n + i];
    boxes.push({ cls, score: best,
      x1: (cx - w / 2 - px) / r, y1: (cy - h / 2 - py) / r,
      x2: (cx + w / 2 - px) / r, y2: (cy + h / 2 - py) / r });
  }
  boxes.sort((a, b) => b.score - a.score);
  const keep = [];
  for (const b of boxes) if (!keep.some(k => k.cls === b.cls && iou(k, b) > IOU)) keep.push(b);
  return keep;
}

document.getElementById('file').onchange = async e => {
  const file = e.target.files[0]; if (!file || !session) return;
  const img = await createImageBitmap(file, { imageOrientation: 'from-image' });
  status('กำลังวิเคราะห์…');
  const t0 = performance.now();
  const pre = preprocess(img);
  const res = await session.run({ [session.inputNames[0]]: pre.tensor });
  const dets = postprocess(res[session.outputNames[0]], pre);
  status(`พบ ${dets.length} ตำแหน่ง ใน ${(performance.now() - t0).toFixed(0)} ms`);

  const cv = document.getElementById('canvas'), g = cv.getContext('2d');
  cv.width = img.width; cv.height = img.height; g.drawImage(img, 0, 0);
  const lw = Math.max(2, img.width / 400);
  g.lineWidth = lw; g.font = `${lw * 8}px sans-serif`;
  const list = document.getElementById('list'); list.innerHTML = '';
  for (const d of dets) {
    const label = `${classes[d.cls]} ${(d.score * 100).toFixed(0)}%`;
    g.strokeStyle = g.fillStyle = `hsl(${d.cls * 33},90%,45%)`;
    g.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);
    g.fillText(label, d.x1, Math.max(lw * 8, d.y1 - lw));
    list.insertAdjacentHTML('beforeend', `<li>${label}</li>`);
  }
};
init().catch(err => status('โหลดโมเดลไม่สำเร็จ: ' + err));
</script>
</body>
</html>
